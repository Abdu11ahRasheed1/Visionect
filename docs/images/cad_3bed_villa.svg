<svg width="640" height="400" viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="320" height="200" rx="8" fill="#09090b"/>
    <defs>
        <pattern id="cadGrid2" width="16" height="16" patternUnits="userSpaceOnUse">
            <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#18181e" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="320" height="200" rx="8" fill="url(#cadGrid2)"/>
    <text x="160" y="16" fill="#ff7440" font-size="8" font-family="monospace" font-weight="bold" text-anchor="middle">3-BED EXECUTIVE VILLA — 20.0m × 13.0m (145 m²)</text>

    <!-- Room Zone Fills -->
    <rect x="25" y="26" width="155" height="74" fill="rgba(255, 90, 31, 0.11)"/>
    <rect x="180" y="26" width="115" height="74" fill="rgba(245, 158, 11, 0.09)"/>
    <rect x="25" y="100" width="62" height="76" fill="rgba(255, 255, 255, 0.05)"/>
    <rect x="87" y="100" width="44" height="76" fill="rgba(34, 197, 94, 0.08)"/>
    <rect x="131" y="100" width="60" height="76" fill="rgba(255, 255, 255, 0.05)"/>
    <rect x="191" y="100" width="58" height="76" fill="rgba(255, 255, 255, 0.05)"/>
    <rect x="249" y="100" width="46" height="76" fill="rgba(34, 197, 94, 0.08)"/>

    <!-- Outer Perimeter -->
    <rect x="25" y="26" width="270" height="150" stroke="#ffffff" stroke-width="3.2"/>

    <!-- Living / Kitchen Divider with Door -->
    <line x1="180" y1="26" x2="180" y2="54" stroke="#e4e4e7" stroke-width="2.2"/>
    <line x1="180" y1="74" x2="180" y2="100" stroke="#e4e4e7" stroke-width="2.2"/>

    <!-- Spine Wall with Doorways -->
    <line x1="25" y1="100" x2="46" y2="100" stroke="#e4e4e7" stroke-width="2.2"/>
    <line x1="64" y1="100" x2="100" y2="100" stroke="#e4e4e7" stroke-width="2.2"/>
    <line x1="116" y1="100" x2="152" y2="100" stroke="#e4e4e7" stroke-width="2.2"/>
    <line x1="170" y1="100" x2="210" y2="100" stroke="#e4e4e7" stroke-width="2.2"/>
    <line x1="228" y1="100" x2="262" y2="100" stroke="#e4e4e7" stroke-width="2.2"/>
    <line x1="278" y1="100" x2="295" y2="100" stroke="#e4e4e7" stroke-width="2.2"/>

    <!-- Back Row Partitions -->
    <line x1="87" y1="100" x2="87" y2="176" stroke="#e4e4e7" stroke-width="2.2"/>
    <line x1="131" y1="100" x2="131" y2="176" stroke="#e4e4e7" stroke-width="2.2"/>
    <line x1="191" y1="100" x2="191" y2="176" stroke="#e4e4e7" stroke-width="2.2"/>
    <line x1="249" y1="100" x2="249" y2="176" stroke="#e4e4e7" stroke-width="2.2"/>

    <!-- Door Arcs -->
    <path d="M 180 54 L 198 54 A 18 18 0 0 1 180 74" stroke="#ff5a1f" stroke-width="1.4" fill="none"/>
    <path d="M 46 100 L 46 118 A 18 18 0 0 0 64 100" stroke="#ff5a1f" stroke-width="1.4" fill="none"/>
    <path d="M 100 100 L 100 116 A 16 16 0 0 0 116 100" stroke="#ff5a1f" stroke-width="1.4" fill="none"/>
    <path d="M 152 100 L 152 118 A 18 18 0 0 0 170 100" stroke="#ff5a1f" stroke-width="1.4" fill="none"/>
    <path d="M 210 100 L 210 118 A 18 18 0 0 0 228 100" stroke="#ff5a1f" stroke-width="1.4" fill="none"/>
    <path d="M 262 100 L 262 116 A 16 16 0 0 0 278 100" stroke="#ff5a1f" stroke-width="1.4" fill="none"/>

    <!-- Windows -->
    <line x1="75" y1="26" x2="130" y2="26" stroke="#ff5a1f" stroke-width="4"/>
    <line x1="215" y1="26" x2="260" y2="26" stroke="#ff5a1f" stroke-width="4"/>

    <!-- Room Labels -->
    <text x="102" y="64" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="700" text-anchor="middle">GREAT ROOM</text>
    <text x="102" y="76" fill="#ff7440" font-size="8" font-family="monospace" text-anchor="middle">11.0m × 7.0m</text>
    <text x="237" y="64" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="700" text-anchor="middle">KITCHEN</text>
    <text x="237" y="76" fill="#a1a1aa" font-size="8" font-family="monospace" text-anchor="middle">9.0m × 7.0m</text>

    <text x="56" y="142" fill="#ffffff" font-size="8.5" font-family="sans-serif" font-weight="700" text-anchor="middle">MASTER</text>
    <text x="109" y="142" fill="#a1a1aa" font-size="8" font-family="sans-serif" font-weight="600" text-anchor="middle">BATH 1</text>
    <text x="161" y="142" fill="#ffffff" font-size="8.5" font-family="sans-serif" font-weight="700" text-anchor="middle">BED 2</text>
    <text x="220" y="142" fill="#ffffff" font-size="8.5" font-family="sans-serif" font-weight="700" text-anchor="middle">BED 3</text>
    <text x="272" y="142" fill="#a1a1aa" font-size="8" font-family="sans-serif" font-weight="600" text-anchor="middle">BATH 2</text>
</svg>