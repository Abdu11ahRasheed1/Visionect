<svg width="640" height="400" viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="320" height="200" rx="8" fill="#09090b"/>
    <defs>
        <pattern id="cadGrid" width="16" height="16" patternUnits="userSpaceOnUse">
            <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#18181e" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="320" height="200" rx="8" fill="url(#cadGrid)"/>
    <line x1="35" y1="20" x2="285" y2="20" stroke="#52525b" stroke-width="1"/>
    <text x="160" y="15" fill="#ff7440" font-size="8" font-family="monospace" font-weight="bold" text-anchor="middle">2-BED MODERN SUITE — 16.0m × 13.0m (88 m²)</text>

    <!-- Room Zone Fills -->
    <rect x="35" y="28" width="140" height="74" fill="rgba(255, 90, 31, 0.12)"/>
    <rect x="175" y="28" width="110" height="74" fill="rgba(245, 158, 11, 0.09)"/>
    <rect x="35" y="102" width="92" height="74" fill="rgba(255, 255, 255, 0.05)"/>
    <rect x="127" y="102" width="66" height="74" fill="rgba(34, 197, 94, 0.08)"/>
    <rect x="193" y="102" width="92" height="74" fill="rgba(255, 255, 255, 0.05)"/>

    <!-- 2D Furniture Blocks -->
    <rect x="48" y="38" width="54" height="18" rx="2" stroke="#52525b" stroke-width="1.2"/>
    <rect x="205" y="36" width="68" height="14" stroke="#52525b" stroke-width="1.2"/>
    <rect x="46" y="132" width="38" height="34" rx="2" stroke="#52525b" stroke-width="1.2"/>
    <rect x="234" y="132" width="38" height="34" rx="2" stroke="#52525b" stroke-width="1.2"/>

    <!-- Outer Perimeter Wall -->
    <rect x="35" y="28" width="250" height="148" stroke="#ffffff" stroke-width="3.2"/>

    <!-- Interior Partitions with Door Cutouts -->
    <line x1="175" y1="28" x2="175" y2="54" stroke="#e4e4e7" stroke-width="2.4"/>
    <line x1="175" y1="76" x2="175" y2="102" stroke="#e4e4e7" stroke-width="2.4"/>

    <!-- Central Spine Wall with 3 Door Cutouts -->
    <line x1="35" y1="102" x2="72" y2="102" stroke="#e4e4e7" stroke-width="2.4"/>
    <line x1="94" y1="102" x2="148" y2="102" stroke="#e4e4e7" stroke-width="2.4"/>
    <line x1="168" y1="102" x2="225" y2="102" stroke="#e4e4e7" stroke-width="2.4"/>
    <line x1="247" y1="102" x2="285" y2="102" stroke="#e4e4e7" stroke-width="2.4"/>

    <!-- Bedroom & Bath Dividers -->
    <line x1="127" y1="102" x2="127" y2="176" stroke="#e4e4e7" stroke-width="2.4"/>
    <line x1="193" y1="102" x2="193" y2="176" stroke="#e4e4e7" stroke-width="2.4"/>

    <!-- Door Swing Arcs (Flame Orange) -->
    <line x1="175" y1="54" x2="197" y2="54" stroke="#ff5a1f" stroke-width="2"/>
    <path d="M 197 54 A 22 22 0 0 1 175 76" stroke="#ff5a1f" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/>

    <line x1="72" y1="102" x2="72" y2="124" stroke="#ff5a1f" stroke-width="2"/>
    <path d="M 72 124 A 22 22 0 0 0 94 102" stroke="#ff5a1f" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/>

    <line x1="148" y1="102" x2="148" y2="122" stroke="#ff5a1f" stroke-width="2"/>
    <path d="M 148 122 A 20 20 0 0 0 168 102" stroke="#ff5a1f" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/>

    <line x1="225" y1="102" x2="225" y2="124" stroke="#ff5a1f" stroke-width="2"/>
    <path d="M 225 124 A 22 22 0 0 0 247 102" stroke="#ff5a1f" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/>

    <!-- Exterior Windows -->
    <line x1="80" y1="28" x2="130" y2="28" stroke="#ff5a1f" stroke-width="4"/>
    <line x1="210" y1="28" x2="255" y2="28" stroke="#ff5a1f" stroke-width="4"/>
    <line x1="60" y1="176" x2="100" y2="176" stroke="#ff5a1f" stroke-width="4"/>
    <line x1="220" y1="176" x2="260" y2="176" stroke="#ff5a1f" stroke-width="4"/>

    <!-- Room Labels -->
    <text x="105" y="68" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="700" text-anchor="middle">LIVING &amp; DINING</text>
    <text x="105" y="80" fill="#ff7440" font-size="8" font-family="monospace" text-anchor="middle">9.0m × 7.0m</text>

    <text x="230" y="68" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="700" text-anchor="middle">CHEF KITCHEN</text>
    <text x="230" y="80" fill="#a1a1aa" font-size="8" font-family="monospace" text-anchor="middle">7.0m × 7.0m</text>

    <text x="81" y="142" fill="#ffffff" font-size="9.5" font-family="sans-serif" font-weight="700" text-anchor="middle">MASTER BED</text>
    <text x="81" y="153" fill="#a1a1aa" font-size="7.5" font-family="monospace" text-anchor="middle">6.0m × 6.0m</text>

    <text x="160" y="144" fill="#e4e4e7" font-size="8.5" font-family="sans-serif" font-weight="700" text-anchor="middle">BATH</text>

    <text x="239" y="142" fill="#ffffff" font-size="9.5" font-family="sans-serif" font-weight="700" text-anchor="middle">GUEST BED</text>
    <text x="239" y="153" fill="#a1a1aa" font-size="7.5" font-family="monospace" text-anchor="middle">6.0m × 6.0m</text>
</svg>