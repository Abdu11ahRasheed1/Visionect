<svg width="640" height="400" viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="320" height="200" rx="8" fill="#09090b"/>
    <defs>
        <pattern id="cadGrid3" width="16" height="16" patternUnits="userSpaceOnUse">
            <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#18181e" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="320" height="200" rx="8" fill="url(#cadGrid3)"/>
    <text x="160" y="16" fill="#ff7440" font-size="8" font-family="monospace" font-weight="bold" text-anchor="middle">1-BED MINIMALIST STUDIO — 8.0m × 6.0m (48 m²)</text>

    <!-- Room Zone Fills -->
    <rect x="45" y="32" width="130" height="144" fill="rgba(255, 90, 31, 0.10)"/>
    <rect x="175" y="32" width="100" height="86" fill="rgba(255, 255, 255, 0.05)"/>
    <rect x="175" y="118" width="100" height="58" fill="rgba(34, 197, 94, 0.08)"/>

    <!-- 2D CAD Furniture Symbols -->
    <rect x="56" y="128" width="52" height="20" rx="2" stroke="#52525b" stroke-width="1.2" fill="rgba(255,255,255,0.03)"/>
    <rect x="66" y="112" width="32" height="11" rx="1" stroke="#3f3f46" stroke-width="1"/>
    <rect x="56" y="42" width="65" height="14" stroke="#52525b" stroke-width="1.2"/>
    <rect x="218" y="46" width="46" height="38" rx="2" stroke="#52525b" stroke-width="1.2" fill="rgba(255,255,255,0.03)"/>
    <rect x="228" y="154" width="38" height="15" rx="4" stroke="#52525b" stroke-width="1.2"/>

    <!-- Structural Perimeter & Partition Walls -->
    <rect x="45" y="32" width="230" height="144" stroke="#f4f4f5" stroke-width="3.2"/>
    <line x1="175" y1="32" x2="175" y2="74" stroke="#e4e4e7" stroke-width="2.4"/>
    <line x1="175" y1="96" x2="175" y2="132" stroke="#e4e4e7" stroke-width="2.4"/>
    <line x1="175" y1="152" x2="175" y2="176" stroke="#e4e4e7" stroke-width="2.4"/>
    <line x1="175" y1="118" x2="275" y2="118" stroke="#e4e4e7" stroke-width="2.4"/>

    <!-- Door Swing Arcs -->
    <line x1="175" y1="74" x2="197" y2="74" stroke="#ff5a1f" stroke-width="2"/>
    <path d="M 197 74 A 22 22 0 0 1 175 96" stroke="#ff5a1f" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/>
    <line x1="175" y1="132" x2="195" y2="132" stroke="#ff5a1f" stroke-width="2"/>
    <path d="M 195 132 A 20 20 0 0 1 175 152" stroke="#ff5a1f" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/>

    <!-- Exterior Windows -->
    <line x1="85" y1="32" x2="135" y2="32" stroke="#ff5a1f" stroke-width="4"/>
    <line x1="205" y1="32" x2="245" y2="32" stroke="#ff5a1f" stroke-width="4"/>
    <line x1="80" y1="176" x2="130" y2="176" stroke="#ff5a1f" stroke-width="4"/>

    <!-- Room Labels -->
    <text x="110" y="88" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="700" text-anchor="middle">LIVING &amp; KITCHEN</text>
    <text x="110" y="101" fill="#ff7440" font-size="8.5" font-family="monospace" text-anchor="middle">4.5m × 6.0m</text>
    <text x="225" y="96" fill="#ffffff" font-size="9.5" font-family="sans-serif" font-weight="700" text-anchor="middle">BEDROOM</text>
    <text x="225" y="108" fill="#a1a1aa" font-size="8" font-family="monospace" text-anchor="middle">3.5m × 3.8m</text>
    <text x="225" y="142" fill="#e4e4e7" font-size="9" font-family="sans-serif" font-weight="700" text-anchor="middle">BATH</text>
</svg>